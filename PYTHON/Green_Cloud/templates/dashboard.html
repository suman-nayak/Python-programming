<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Wiki Explorer Pro</title>
    <style>
        :root {
            --primary: #6366f1;
            --secondary: #4ade80;
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: var(--card);
            padding: 2.5rem;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
            text-align: center;
            width: 90%;
            max-width: 550px;
        }

        .controls { display: flex; justify-content: center; gap: 20px; margin-bottom: 1.5rem; }

        .btn {
            border: none;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mic-btn { background: var(--primary); width: 70px; height: 70px; }
        .random-btn { background: #64748b; width: 50px; height: 50px; border-radius: 12px; }

        .mic-btn.listening { animation: pulse 1.5s infinite; background: #ef4444; }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        #result-box {
            margin-top: 2rem;
            text-align: left;
            padding: 1.5rem;
            border-radius: 12px;
            background: rgba(255,255,255,0.05);
            display: none;
        }

        .speak-btn {
            background: var(--secondary);
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }

        #status { color: #94a3b8; font-size: 0.9rem; margin: 10px 0; }
    </style>
</head>
<body>

<div class="container">
    <h1>Wiki Explorer</h1>
    
    <div class="controls">
        <button class="btn random-btn" onclick="fetchRandom()" title="Random Topic">
            <svg fill="white" width="24" height="24" viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.73 9.42l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.12z"/></svg>
        </button>

        <button id="mic-btn" class="btn mic-btn">
            <svg fill="white" width="30" height="30" viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
        </button>
    </div>

    <p id="status">Click the mic or get a random topic</p>

    <div id="result-box">
        <h3 id="res-topic" style="color: var(--secondary); margin-top: 0;"></h3>
        <p id="res-summary" style="line-height: 1.6;"></p>
        <button class="speak-btn" onclick="speakText()">🔊 Read Aloud</button>
    </div>
</div>

<script>
    const btn = document.getElementById('mic-btn');
    const status = document.getElementById('status');
    const resultBox = document.getElementById('result-box');

    // 1. Voice Recognition Logic
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
        const recognition = new SpeechRecognition();
        btn.onclick = () => recognition.start();
        recognition.onstart = () => {
            btn.classList.add('listening');
            status.innerText = "Listening...";
        };
        recognition.onresult = (event) => {
            const topic = event.results[0][0].transcript;
            searchWiki(topic);
        };
        recognition.onspeechend = () => {
            btn.classList.remove('listening');
            recognition.stop();
        };
    }

    // 2. Search Function
    function searchWiki(topic) {
        status.innerText = `Searching for "${topic}"...`;
        fetch('/search', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({topic: topic})
        })
        .then(res => res.json())
        .then(data => {
            if(data.status === "success") {
                showResult(data.topic, data.summary);
            } else {
                status.innerText = "Topic not found. Try again!";
            }
        });
    }

    // 3. Random Topic Function
    function fetchRandom() {
        status.innerText = "Getting random topic...";
        fetch('/random')
        .then(res => res.json())
        .then(data => searchWiki(data.topic));
    }

    function showResult(title, text) {
        resultBox.style.display = 'block';
        document.getElementById('res-topic').innerText = title;
        document.getElementById('res-summary').innerText = text;
        status.innerText = "Found it!";
    }

    // 4. Text-to-Speech (New Feature)
    function speakText() {
        const text = document.getElementById('res-summary').innerText;
        const utterance = new SpeechSynthesisUtterance(text);
        window.speechSynthesis.speak(utterance);
    }
</script>
</body>
</html>
