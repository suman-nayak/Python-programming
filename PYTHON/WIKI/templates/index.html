<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Wiki Explorer</title>
    <style>
        :root {
            --primary: #6366f1;
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: var(--card);
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            text-align: center;
            width: 90%;
            max-width: 500px;
            transition: transform 0.3s ease;
        }

        h1 { margin-bottom: 1.5rem; font-weight: 300; }

        .mic-btn {
            background: var(--primary);
            border: none;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            cursor: pointer;
            margin-bottom: 1rem;
            transition: all 0.3s ease;
            box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.7);
        }

        .mic-btn.listening {
            animation: pulse 1.5s infinite;
            background: #ef4444;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        #status { font-style: italic; color: #94a3b8; margin-bottom: 1rem; }

        #result-box {
            margin-top: 2rem;
            text-align: left;
            padding: 1rem;
            border-top: 1px solid #334155;
            display: none;
        }

        .topic-title { color: var(--primary); font-weight: bold; font-size: 1.2rem; }
    </style>
</head>
<body>

<div class="container">
    <h1>Wiki Voice Search</h1>
    <button id="mic-btn" class="mic-btn">
        <svg fill="white" width="30" height="30" viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
    </button>
    <p id="status">Click the mic to speak</p>

    <div id="result-box">
        <p class="topic-title" id="res-topic"></p>
        <p id="res-summary"></p>
    </div>
</div>

<script>
    const btn = document.getElementById('mic-btn');
    const status = document.getElementById('status');
    const resultBox = document.getElementById('result-box');

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    
    if (!SpeechRecognition) {
        status.innerText = "Browser does not support Speech Recognition.";
    } else {
        const recognition = new SpeechRecognition();

        btn.onclick = () => {
            recognition.start();
            btn.classList.add('listening');
            status.innerText = "Listening...";
        };

        recognition.onresult = (event) => {
            const topic = event.results[0][0].transcript;
            btn.classList.remove('listening');
            status.innerText = `Searching for: "${topic}"...`;
            
            // Send to Flask
            fetch('/search', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({topic: topic})
            })
            .then(res => res.json())
            .then(data => {
                if(data.status === "success") {
                    resultBox.style.display = 'block';
                    document.getElementById('res-topic').innerText = data.topic;
                    document.getElementById('res-summary').innerText = data.summary;
                    status.innerText = "Done!";
                } else {
                    status.innerText = "Error finding topic.";
                }
            });
        };

        recognition.onspeechend = () => {
            recognition.stop();
            btn.classList.remove('listening');
        };
    }
</script>

</body>
</html>
